name = "nos-anonymizer-api"
main = "cloudflare/worker.ts"
compatibility_date = "2026-10-10"

[observability]
enabled = true

[[containers]]
class_name = "BackendContainer"
scheduling_policy = "durable_object"

[containers.images.api]
dockerfile = "./Dockerfile"

[[durable_objects.bindings]]
name = "BACKEND"
class_name = "BackendContainer"

[exports.BackendContainer]
type = "durable-object"
storage = "sqlite"

# Non-secret runtime configuration only. Never add GEMINI_API_KEY or
# BACKEND_API_TOKEN here; create both with `wrangler secret put`.
[vars]
BACKEND_HOST = "0.0.0.0"
BACKEND_PORT = "8080"
BACKEND_WORKERS = "1"
BACKEND_PRODUCTION = "true"
BACKEND_CORS_ALLOW_ORIGINS = "https://app.example.com"
BACKEND_MAX_BLOCK_COUNT = "100"
BACKEND_MAX_TEXT_LENGTH = "10000"
BACKEND_MAX_REQUEST_BYTES = "1048576"
