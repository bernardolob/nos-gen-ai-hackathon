name: Test Gemini Integration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests with coverage
        run: pytest --cov=nos_anonymizer --cov-report=term-missing

      - name: Build package
        run: python -m build

      - name: Build production container
        if: matrix.python-version == '3.11'
        run: docker build -t nos-anonymizer-api:test .

      - name: Validate Cloudflare Worker
        if: matrix.python-version == '3.11'
        run: |
          npm ci
          npm run check

      - name: Verify package and CLI imports
        run: |
          python -c "import nos_anonymizer; assert nos_anonymizer.MODEL_ID == 'gemini-3.5-flash'"
          nos-gemini-check --help
