name: Test Gemini Integration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests with coverage
        run: pytest --cov=nos_anonymizer --cov-report=term-missing

      - name: Build package
        run: python -m build

      - name: Verify package and entry points
        run: |
          python -c "import nos_anonymizer; import nos_anonymizer.api; assert nos_anonymizer.MODEL_ID == 'gemini-3.5-flash'"
          nos-gemini-check --help

  worker-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Worker dependencies
        run: npm ci

      - name: Type-check Cloudflare Worker
        run: npm run check
